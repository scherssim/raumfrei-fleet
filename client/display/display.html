<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RaumFrei Anzeige</title>
<!--
  display.html - die Seite, die auf dem Tuerschild laeuft.

  Wird NICHT per file:// geoeffnet, sondern von raumfrei-display.service unter
  http://127.0.0.1:8080/ ausgeliefert. Grund: unter file:// ist der Origin
  "null", und localStorage sowie CORS verhalten sich dort je nach Browser
  unterschiedlich. Der Cache ist hier aber die halbe Miete.

  Konfiguration kommt aus config.json daneben (von der Ansible-Rolle kiosk
  gerendert):
      { "roomId": "201", "roomsApiUrl": "https://...", "refreshSeconds": 60,
        "rotate": 0, "deviceId": "d-...", "configVersion": "..." }
  Ein ?room=201 in der URL hat Vorrang - so laesst sich die Seite am
  Arbeitsplatz pruefen, ohne die Konfiguration anzufassen.

  Aufbau der Seite, von oben nach unten:
      Kopf     Raum, Stockwerk, Uhr
      Jetzt    Ampel fuer den Moment - die Frage vor der Tuer
      Woche    Mo-Fr x Lektion 1-8 fuer DIESEN Raum
      Fuss     Frische des Stands, Legende, Geraetekennung

  Warum die ganze Woche und nicht nur der heutige Tag: das Buchungsmodell des
  Backends ist ohnehin wochenweise (Zellschluessel "<Tag>#<Lektion>", ohne
  Datum). Wer vor einem belegten Zimmer steht, will als Naechstes wissen,
  wann es frei ist - bei einer Tagesliste steht das fruehestens morgen auf
  dem Schirm. Dieselbe Matrix benutzt die Verwaltungsoberflaeche
  RaumFrei.html; hier ist sie nur lesend, ein Tuerschild bucht nichts.

  Das Good-Enough-Kriterium "Backend offline -> Displays zeigen weiter den
  letzten Stand" ist der Grund fuer den localStorage-Cache: faellt /rooms aus,
  bleibt der zuletzt geholte Plan stehen und die Kopfzeile sagt ehrlich, wie
  alt er ist. Ein Display, das "API nicht erreichbar" zeigt, ist im Gang
  wertlos - eines mit einem 20 Minuten alten Plan nicht.

  Keine externen Abhaengigkeiten: die Geraete kommen nur an die API, sonst an
  nichts. Jede CDN-Zeile waere ein Ausfall in der Wartezeit.
-->
<style>
  :root {
    --bg:     #0e1116;
    --panel:  #171c24;
    --panel2: #1e2531;
    --line:   #262e3a;
    --text:   #eef2f7;
    --muted:  #8d9aad;
    --free:   #2fbf71;
    --busy:   #e5484d;
    --soon:   #e8a33d;
    --stale:  #e8a33d;
    --freeBg: rgba(47,191,113,.12);
    --busyBg: rgba(229,72,77,.16);
    --busyTx: #f6a6a8;

    /* Alle Groessen beziehen sich auf die STAGE, nicht auf das Viewport: bei
       90 und 270 Grad sind Hoehe und Breite vertauscht (siehe #stage). Ohne
       diesen Tausch waere die Schrift auf einem hochkant montierten Schirm um
       das Seitenverhaeltnis zu gross - und die Wochenmatrix, die anders als
       eine Tagesliste keinen Platz uebrig hat, liefe unten heraus. */
    --h: 1vh;
    --w: 1vw;
  }
  body.rot-90, body.rot-270 { --h: 1vw; --w: 1vh; }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.4 "Segoe UI", Roboto, system-ui, sans-serif;
    overflow: hidden;
  }

  /* Drehung wird hier geloest und nicht im Compositor: cage/wlroots bringt
     dafuer keinen verlaesslichen Schalter mit, und ein hochkant montiertes
     Tuerschild soll nicht vom Wayland-Backend abhaengen. */
  #stage {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    transform-origin: center center;
  }
  body.rot-90  #stage,
  body.rot-270 #stage { width: 100vh; height: 100vw; }
  body.rot-90  #stage { transform: rotate(90deg)  translate(0, 0); }
  body.rot-180 #stage { transform: rotate(180deg); }
  body.rot-270 #stage { transform: rotate(270deg); }
  body.rot-90, body.rot-270 { display: flex; align-items: center; justify-content: center; }

  header {
    display: flex; align-items: baseline; gap: calc(1 * var(--w));
    padding: calc(1.8 * var(--h)) calc(3 * var(--w)) calc(1.2 * var(--h));
    border-bottom: 1px solid var(--line); flex: none;
  }
  header .room { font-size: calc(5.4 * var(--h)); font-weight: 700; line-height: 1; }
  header .floor { font-size: calc(2 * var(--h)); color: var(--muted); }
  header .clock {
    margin-left: auto; font-size: calc(4.2 * var(--h)); font-weight: 300;
    font-variant-numeric: tabular-nums;
  }

  #now {
    padding: calc(2 * var(--h)) calc(3 * var(--w));
    display: flex; align-items: center; gap: calc(2.5 * var(--w));
    border-bottom: 1px solid var(--line); flex: none;
  }
  #now .light {
    width: calc(9 * var(--h)); height: calc(9 * var(--h)); border-radius: 50%; flex: none;
    background: var(--muted); box-shadow: 0 0 calc(5 * var(--h)) calc(-1 * var(--h)) currentColor;
  }
  #now.free .light { background: var(--free); color: var(--free); }
  #now.busy .light { background: var(--busy); color: var(--busy); }
  #now .headline { font-size: calc(5.6 * var(--h)); font-weight: 700; line-height: 1.05; }
  #now.free .headline { color: var(--free); }
  #now.busy .headline { color: var(--busy); }
  #now .detail { font-size: calc(2.4 * var(--h)); color: var(--muted); margin-top: calc(.6 * var(--h)); }

  /* ---------------------------------------------------------------- Woche */

  #week {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    padding: calc(1.4 * var(--h)) calc(3 * var(--w));
  }
  #week h2 {
    font-size: calc(1.9 * var(--h)); font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em;
    margin: 0 0 calc(1.1 * var(--h)); flex: none;
  }

  /* Feste Zeilenzahl statt Scrollen: acht Lektionen plus Kopfzeile teilen
     sich den Rest der Hoehe. So passt die Matrix auf jeden Schirm, ohne dass
     die Seite eine Bildlaufleiste braucht - die koennte auf einem Tuerschild
     niemand bedienen. */
  #grid {
    flex: 1; min-height: 0; display: grid;
    grid-template-columns: auto repeat(5, 1fr);
    grid-template-rows: auto repeat(8, 1fr);
    gap: calc(.5 * var(--h)) calc(.5 * var(--w));
  }

  #grid .gh {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding-bottom: calc(.6 * var(--h));
    font-size: calc(2.2 * var(--h)); font-weight: 700; color: var(--muted);
  }
  #grid .gh .date { font-size: calc(1.5 * var(--h)); font-weight: 400; }
  #grid .gh.today { color: var(--text); }
  #grid .gh.today .date { color: var(--soon); }

  #grid .rh {
    display: flex; flex-direction: column; align-items: flex-end; justify-content: center;
    padding-right: calc(.9 * var(--w));
    font-size: calc(2 * var(--h)); font-weight: 600; color: var(--muted);
  }
  #grid .rh .time {
    font-size: calc(1.4 * var(--h)); font-weight: 400;
    font-variant-numeric: tabular-nums;
  }
  #grid .rh.current { color: var(--text); }

  #grid .c {
    display: flex; align-items: center; justify-content: center;
    border-radius: calc(.7 * var(--h)); overflow: hidden;
    padding: 0 calc(.5 * var(--w));
  }
  #grid .c.free { background: var(--freeBg); }
  #grid .c.busy { background: var(--busyBg); }
  #grid .c .who {
    font-size: calc(1.8 * var(--h)); color: var(--busyTx);
    max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Die heutige Spalte bekommt eine Kante, die laufende Lektion einen
     kraeftigen Rahmen - beides ohne Farbwechsel, damit frei/belegt die
     einzige Farbaussage der Matrix bleibt. */
  #grid .c.today { box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  #grid .c.past  { opacity: .4; }
  #grid .c.current {
    box-shadow: inset 0 0 0 calc(.4 * var(--h)) var(--soon);
    opacity: 1;
  }

  #grid .empty {
    grid-column: 1 / -1; grid-row: 1 / -1;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: calc(2.4 * var(--h)); text-align: center;
  }

  footer {
    display: flex; gap: calc(1.5 * var(--w)); align-items: center;
    padding: calc(1.1 * var(--h)) calc(3 * var(--w));
    border-top: 1px solid var(--line); flex: none;
    font-size: calc(1.7 * var(--h)); color: var(--muted);
  }
  footer .grow { flex: 1; }
  footer .stale { color: var(--stale); font-weight: 600; }
  footer .offline-dot {
    width: calc(.9 * var(--h)); height: calc(.9 * var(--h)); border-radius: 50%;
    background: var(--free); display: inline-block; margin-right: calc(.5 * var(--w));
  }
  footer.offline .offline-dot { background: var(--stale); }
  footer .legend { display: flex; gap: calc(1.2 * var(--w)); align-items: center; }
  footer .legend span { display: flex; align-items: center; gap: calc(.5 * var(--w)); }
  footer .swatch {
    width: calc(1.6 * var(--h)); height: calc(1.6 * var(--h));
    border-radius: calc(.4 * var(--h)); display: inline-block;
  }
  footer .swatch.free { background: var(--freeBg); border: 1px solid var(--free); }
  footer .swatch.busy { background: var(--busyBg); border: 1px solid var(--busy); }
</style>
</head>
<body>
<div id="stage">
  <header>
    <div>
      <div class="room" id="roomName">&mdash;</div>
      <div class="floor" id="roomFloor"></div>
    </div>
    <div class="clock" id="clock">--:--</div>
  </header>

  <div id="now">
    <div class="light"></div>
    <div>
      <div class="headline" id="nowHeadline">Wird geladen</div>
      <div class="detail" id="nowDetail">Raumplan wird geholt&hellip;</div>
    </div>
  </div>

  <div id="week">
    <h2 id="weekTitle">Woche</h2>
    <div id="grid"></div>
  </div>

  <footer id="foot">
    <span><span class="offline-dot"></span><span id="freshness">noch kein Stand</span></span>
    <span class="legend">
      <span><i class="swatch free"></i>frei</span>
      <span><i class="swatch busy"></i>belegt</span>
    </span>
    <span class="grow"></span>
    <span id="deviceInfo"></span>
  </footer>
</div>

<script>
"use strict";

/* Stammdaten identisch zu RaumFrei.html - Zellschluessel "<Tag>#<Lektion>". */
var DAY_CODES = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
var WEEK_DAYS = ["Mo", "Di", "Mi", "Do", "Fr"];
var LESSONS = [
  { n: 1, from: "07:30", to: "08:20" },
  { n: 2, from: "08:25", to: "09:15" },
  { n: 3, from: "09:30", to: "10:20" },
  { n: 4, from: "10:25", to: "11:15" },
  { n: 5, from: "11:20", to: "12:10" },
  { n: 6, from: "13:00", to: "13:50" },
  { n: 7, from: "13:55", to: "14:45" },
  { n: 8, from: "14:50", to: "15:40" }
];

var CACHE_KEY = "raumfrei.display.cache";
var config = { roomId: null, roomsApiUrl: "", refreshSeconds: 60, rotate: 0, deviceId: "" };
var rooms = null;
var fetchedAt = null;
var online = false;

function byId(id) { return document.getElementById(id); }
function pad(n) { return (n < 10 ? "0" : "") + n; }
function hhmm(date) { return pad(date.getHours()) + ":" + pad(date.getMinutes()); }
function ddmm(date) { return pad(date.getDate()) + "." + pad(date.getMonth() + 1) + "."; }
function minutesOf(text) {
  var parts = text.split(":");
  return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
}
function esc(value) {
  return String(value === null || value === undefined ? "" : value)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ------------------------------------------------------------ Konfiguration */

async function loadConfig() {
  try {
    var res = await fetch("config.json", { cache: "no-store" });
    if (res.ok) {
      var loaded = await res.json();
      for (var key in loaded) { if (loaded[key] !== null) config[key] = loaded[key]; }
    }
  } catch (err) {
    /* Ohne config.json laeuft die Seite trotzdem - dann zaehlt nur ?room=. */
  }
  var params = new URLSearchParams(location.search);
  if (params.get("room")) config.roomId = params.get("room");
  if (params.get("api")) config.roomsApiUrl = params.get("api");
  if (params.get("rotate")) config.rotate = parseInt(params.get("rotate"), 10) || 0;

  var rotate = ((parseInt(config.rotate, 10) || 0) % 360 + 360) % 360;
  if (rotate) document.body.classList.add("rot-" + rotate);

  byId("deviceInfo").textContent =
    (config.deviceId || "") + (config.configVersion ? " · " + config.configVersion : "");
}

/* -------------------------------------------------------------------- Daten */

function readCache() {
  try {
    var raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (err) {
    return null;
  }
}

function writeCache(payload) {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify(payload));
  } catch (err) {
    /* Voller oder gesperrter Speicher darf die Anzeige nicht kippen. */
  }
}

async function refresh() {
  if (config.roomsApiUrl) {
    try {
      var base = String(config.roomsApiUrl).replace(/\/+$/, "");
      var res = await fetch(base + "/rooms", { cache: "no-store" });
      if (res.ok) {
        var data = await res.json();
        if (Array.isArray(data)) {
          rooms = data;
          fetchedAt = Date.now();
          online = true;
          writeCache({ fetchedAt: fetchedAt, rooms: rooms });
          render();
          return;
        }
      }
    } catch (err) {
      /* faellt unten auf den Cache zurueck */
    }
  }
  online = false;
  if (!rooms) {
    var cached = readCache();
    if (cached && Array.isArray(cached.rooms)) {
      rooms = cached.rooms;
      fetchedAt = cached.fetchedAt;
    }
  }
  render();
}

/* ------------------------------------------------------------- Darstellung */

function currentRoom() {
  if (!rooms) return null;
  for (var i = 0; i < rooms.length; i++) {
    if (String(rooms[i].roomId) === String(config.roomId)) return rooms[i];
  }
  return null;
}

function lessonState(now) {
  var minutes = now.getHours() * 60 + now.getMinutes();
  for (var i = 0; i < LESSONS.length; i++) {
    var from = minutesOf(LESSONS[i].from);
    var to = minutesOf(LESSONS[i].to);
    if (minutes >= from && minutes < to) return { index: i, running: true };
    if (minutes < from) return { index: i, running: false };
  }
  return { index: -1, running: false };
}

/* Montag der angezeigten Woche. Am Wochenende ist die laufende Woche vorbei -
   dann steht der kommende Montag oben, sonst zeigte das Schild am Sonntag
   fuenf ausgegraute Tage. Die Buchungen selbst sind datumslos und gelten
   wochenweise wiederkehrend; das Datum in der Kopfzeile ist Beschriftung. */
function weekStart(now) {
  var day = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var dow = day.getDay();
  var delta = dow === 0 ? 1 : (dow === 6 ? 2 : 1 - dow);
  day.setDate(day.getDate() + delta);
  return day;
}

function renderWeek(bookings, now, state) {
  var dow = now.getDay();
  var ahead = (dow === 0 || dow === 6);     /* Wochenende: kommende Woche */
  var todayIndex = ahead ? -1 : dow - 1;    /* 0 = Mo ... 4 = Fr */
  var monday = weekStart(now);

  var dates = [];
  for (var i = 0; i < 5; i++) {
    dates.push(new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i));
  }
  byId("weekTitle").textContent = "Woche " + ddmm(dates[0]) + " – " + ddmm(dates[4])
    + (ahead ? " · naechste Woche" : "");

  var cells = ['<div class="gh"></div>'];
  for (var d = 0; d < 5; d++) {
    cells.push('<div class="gh' + (d === todayIndex ? " today" : "") + '">'
      + WEEK_DAYS[d] + '<span class="date">' + ddmm(dates[d]) + "</span></div>");
  }

  for (var l = 0; l < LESSONS.length; l++) {
    var lesson = LESSONS[l];
    var rowCurrent = (todayIndex >= 0 && state.running && state.index === l);
    cells.push('<div class="rh' + (rowCurrent ? " current" : "") + '">' + lesson.n
      + '<span class="time">' + lesson.from + "</span></div>");

    for (var c = 0; c < 5; c++) {
      var who = bookings[WEEK_DAYS[c] + "#" + lesson.n];
      var isToday = (c === todayIndex);
      var classes = ["c", who ? "busy" : "free"];
      if (isToday) classes.push("today");
      /* Vergangen ist alles vor heute und - am heutigen Tag - jede Lektion
         vor der laufenden. state.index === -1 heisst: der Schultag ist
         durch, dann ist die ganze heutige Spalte Vergangenheit. */
      if (todayIndex >= 0 && (c < todayIndex
          || (isToday && (state.index === -1 || l < state.index)))) {
        classes.push("past");
      }
      if (isToday && state.running && state.index === l) classes.push("current");
      cells.push('<div class="' + classes.join(" ") + '">'
        + (who ? '<span class="who">' + esc(who) + "</span>" : "") + "</div>");
    }
  }

  byId("grid").innerHTML = cells.join("");
}

function showEmptyWeek(message) {
  byId("weekTitle").textContent = "Woche";
  byId("grid").innerHTML = '<div class="empty">' + esc(message) + "</div>";
}

function render() {
  var now = new Date();
  byId("clock").textContent = hhmm(now);

  var foot = byId("foot");
  foot.classList.toggle("offline", !online);
  if (fetchedAt) {
    var age = Math.round((Date.now() - fetchedAt) / 60000);
    byId("freshness").innerHTML = online
      ? "aktuell · " + hhmm(new Date(fetchedAt))
      : '<span class="stale">Stand von ' + hhmm(new Date(fetchedAt))
        + " (" + age + " min alt)</span>";
  } else {
    byId("freshness").innerHTML = online ? "aktuell" : '<span class="stale">kein Stand verfuegbar</span>';
  }

  var box = byId("now");

  if (!config.roomId) {
    byId("roomName").textContent = "Kein Raum";
    byId("roomFloor").textContent = "";
    box.className = "";
    byId("nowHeadline").textContent = "Nicht zugewiesen";
    byId("nowDetail").textContent = "Diesem Geraet ist im Backend noch kein Raum zugewiesen.";
    showEmptyWeek("Ohne Raumzuweisung gibt es keinen Wochenplan.");
    return;
  }

  var room = currentRoom();
  byId("roomName").textContent = room ? (room.name || room.roomId) : ("Zimmer " + config.roomId);
  byId("roomFloor").textContent = room ? (room.floor || "") : "";

  if (!room) {
    box.className = "";
    byId("nowHeadline").textContent = "Kein Plan";
    byId("nowDetail").textContent = fetchedAt
      ? "Raum " + config.roomId + " kommt im zuletzt geholten Plan nicht vor."
      : "Raumplan noch nicht geholt.";
    showEmptyWeek(fetchedAt
      ? "Raum " + config.roomId + " fehlt im zuletzt geholten Plan."
      : "Raumplan wird geholt.");
    return;
  }

  var bookings = room.bookings || {};
  var dayCode = DAY_CODES[now.getDay()];
  var state = lessonState(now);

  /* Kopfaussage: laeuft gerade eine Lektion, gilt deren Belegung. Sonst wird
     die naechste angekuendigt - "jetzt frei" allein hilft niemandem, der vor
     der Tuer steht und wissen will, ob er in zehn Minuten raus muss. */
  if (dayCode === "Sa" || dayCode === "So") {
    box.className = "free";
    byId("nowHeadline").textContent = "Frei";
    byId("nowDetail").textContent = "Wochenende – keine Lektionen.";
  } else if (state.index === -1) {
    box.className = "free";
    byId("nowHeadline").textContent = "Frei";
    byId("nowDetail").textContent = "Ausserhalb der Lektionszeiten.";
  } else {
    var lesson = LESSONS[state.index];
    var who = bookings[dayCode + "#" + lesson.n];
    if (state.running) {
      box.className = who ? "busy" : "free";
      byId("nowHeadline").textContent = who ? "Belegt" : "Frei";
      byId("nowDetail").textContent = (who ? who + " · " : "")
        + lesson.n + ". Lektion bis " + lesson.to;
    } else {
      box.className = "free";
      byId("nowHeadline").textContent = "Frei";
      byId("nowDetail").textContent = who
        ? "Naechste Lektion " + lesson.from + " – " + who
        : "Naechste Lektion " + lesson.from + " – ebenfalls frei";
    }
  }

  renderWeek(bookings, now, state);
}

/* ------------------------------------------------------------------- Start */

(async function start() {
  await loadConfig();
  var cached = readCache();
  if (cached && Array.isArray(cached.rooms)) {
    rooms = cached.rooms;
    fetchedAt = cached.fetchedAt;
    render();
  }
  await refresh();
  setInterval(refresh, Math.max(15, parseInt(config.refreshSeconds, 10) || 60) * 1000);
  setInterval(render, 20000);   /* Uhr und Lektionswechsel, ohne Netzverkehr */
})();
</script>
</body>
</html>
