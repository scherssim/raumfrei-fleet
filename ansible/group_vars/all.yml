---
# group_vars/all.yml - Vorgaben fuer einen Lauf OHNE desired.json.
#
# Im Betrieb kommen dieselben Namen aus /etc/raumfrei/desired.json als
# extra-vars und ueberschreiben alles hier. Diese Datei ist damit zweierlei:
# die Dokumentation der Schnittstelle zwischen Backend und Ansible, und die
# Moeglichkeit, das Playbook von Hand gegen ein Geraet zu fahren:
#
#   sudo ansible-playbook -i localhost, -c local ansible/site.yml \
#        -e roomId=201 -e kiosk_force=true

# --- Das schickt das Backend (GET /config/{deviceId}) ----------------------
deviceId: "unbekannt"
roomId: null
displayUrl: null
roomsApiUrl: ""
pullRepo: "https://github.com/scherssim/raumfrei-fleet"
pullBranch: "main"
checkinIntervalSeconds: 2700
configVersion: "-"
status: "ACTIVE"
kiosk:
  browser: "luakit"
  rotate: 0
  refreshSeconds: 60

# --- Daraus abgeleitet ------------------------------------------------------
repo_root: "{{ playbook_dir | dirname }}"

# Ob ein Geraet ein Tuerschild ist, steht NICHT im Backend, sondern im Image:
# cloud-init legt /etc/raumfrei/kiosk.enabled genau auf den Display-VMs und
# auf dem Pi an, nicht in den ~20 headless Agent-Containern. Ein Container,
# der cage und einen Browser installiert, wuerde die Skalierungsmessung
# verfaelschen und 20-mal denselben Ballast ziehen.
#
# Das Backend darf die Kiosk-Rolle global abschalten (kiosk.enabled = false in
# POST /settings), aber nicht einschalten, wo keine Anzeige haengt.
kiosk_enabled: >-
  {{ (kiosk_force | default(false) | bool)
     or ((kiosk.enabled | default(true) | bool)
         and ('/etc/raumfrei/kiosk.enabled' is exists)) }}

# Nutzer, unter dem Anzeige und Browser laufen. Kein Login, keine Shell -
# der Kiosk braucht weder das eine noch das andere.
display_user: "display"
display_dir: "/var/lib/raumfrei/display"
display_port: 8080

# Zuordnung Wunschbrowser -> Paket.
#
# Am 31.08.2026 auf display-a nachgemessen, nachdem die Rolle mit "No package
# matching 'cog' is available" abbrach:
#
#   cog               gibt es in Ubuntu 24.04 UEBERHAUPT nicht - weder in
#                     universe noch sonstwo; "apt-cache search ^cog" ist leer.
#                     Das Paket ist Debian-only. (Hier stand vorher, cog sei
#                     der einzige echte .deb-Browser. Das war falsch.)
#   chromium-browser  existiert nur als Snap-Platzhalter (2:1snap1-0ubuntu2):
#                     apt meldet EIN Paket, der postinst laedt dann rund
#                     170 MB Snap nach. Das faellt mitten in die
#                     Provisionierung und dominiert die Messreihe M1 - genau
#                     der Grund, aus dem schon das Cloud-Image statt des
#                     Server-Installers gewaehlt wurde.
#   firefox           dasselbe Muster.
#   surf              echtes .deb, WebKitGTK - aber X11-only. Ruft
#                     gdk_x11_window_get_xid() ohne Ruecksicht auf den
#                     Backend auf und stirbt unter Wayland an BadWindow.
#                     Unbrauchbar, das Tuerschild faehrt Wayland.
#   luakit            echtes .deb, WebKitGTK, Wayland-tauglich. Am 31.08.
#                     unter cage geprueft: laeuft. Deshalb die Vorgabe.
#                     Einschraenkung: luakit zeigt unten eine einzeilige
#                     Statusleiste, die sich nur ueber eine eigene rc.lua
#                     abschalten laesst - kosmetisch, gehoert in den Bericht.
#
# Die uebrigen Eintraege bleiben als Ausweichmoeglichkeit stehen; welcher
# Browser laeuft, entscheidet das Backend ueber kiosk.browser.
kiosk_browser_packages:
  luakit: "luakit"
  cog: "cog"
  chromium: "chromium-browser"
  firefox: "firefox"
